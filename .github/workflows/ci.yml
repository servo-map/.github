# The tests of the tooling other repositories run from here (vendor/, actions/setup) and a lint of
# the workflows they call. GitHub-hosted: the repository is public, so the minutes are free.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node --test
      # Fails when a vendored file (profile/README.md) was hand-edited away from its source (core).
      - run: node .vendor/check.mjs

  # The job every Servo Map repository runs (actionlint.yml owns the action and tool version), called
  # locally so this repository lints itself with the definition it publishes. Reports as
  # `actionlint / Lint workflows`.
  actionlint:
    uses: ./.github/workflows/actionlint.yml
    with:
      runs-on: '["ubuntu-latest"]'
